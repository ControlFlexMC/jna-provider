# Version of this mod. Shown in the mod list and in the log line at startup.
version=0.9.0

# JNA that gets bundled into the jar. Bumping this is the only thing needed to
# ship a newer JNA: the mod contains no code that touches JNA's API.
jnaVersion=5.12.1

# Compile-only. Forge 1.7.10 is never packaged; only @Mod and FMLLog are used,
# which live in the universal jar and are not Minecraft classes.
forgeVersion=1.7.10-10.13.4.1614-1.7.10
